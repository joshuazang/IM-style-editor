<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding host</title>
<iframe id="editor" src="/index.html" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
<script>
const editor = document.querySelector('#editor');
window.onboarding = {
  saved: [],
  note: {uuid: 'onboarding-note', content_type: 'Note',
         content: {title: 'Onboarding fixture', text: 'Existing smoke message'}}
};
window.addEventListener('message', event => {
  if (event.source !== editor.contentWindow || event.origin !== location.origin) return;
  const message = event.data;
  if (!message || typeof message !== 'object') return;
  let data;
  if (message.action === 'stream-context-item') {
    data = {item: structuredClone(onboarding.note)};
  } else if (message.action === 'save-items') {
    onboarding.note = structuredClone(message.data.items[0]);
    onboarding.saved.push(structuredClone(onboarding.note));
    data = {items: structuredClone(message.data.items)};
  } else {
    return;
  }
  editor.contentWindow.postMessage({action: 'reply', original: message, data}, location.origin);
});
editor.addEventListener('load', () => {
  editor.contentWindow.postMessage({
    action: 'component-registered', sessionKey: 'synthetic-onboarding-session',
    componentData: {},
    data: {uuid: 'onboarding-component', environment: 'web', platform: 'web', activeThemeUrls: []}
  }, location.origin);
});
</script>
