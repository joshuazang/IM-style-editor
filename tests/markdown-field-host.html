<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8">
<link rel="stylesheet" href="../shared/ui/markdown.css">
<style>body{font:18px/1.5 system-ui;margin:20px;max-width:720px}section{border:1px solid #ddd;border-radius:12px;padding:8px;margin-bottom:20px}[hidden]{display:none!important}</style>
<script src="../shared/vendor/markdown-editor.js"></script>
<script src="../shared/ui/markdown-model.js"></script><script src="../shared/ui/markdown-commands.js"></script><script src="../shared/ui/icons.js"></script><script src="../shared/ui/selection-format.js"></script><script src="../shared/ui/markdown-editor.js"></script>
</head><body><section id="capture"></section><section id="detail"></section>
<script>
window.sends=[];window.changes=[];
window.capture=imRichField.create({id:'capture-editor',label:'Capture',capture:true,sendButton:true,placeholder:'Write a message…',onChange:text=>changes.push(text),onSubmit:()=>sends.push(capture.dom.value)});
window.detail=imRichField.create({id:'detail-editor',label:'Card body',capture:false});
document.querySelector('#capture').append(capture.wrapper);document.querySelector('#detail').append(detail.wrapper);
</script></body></html>
