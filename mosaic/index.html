<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="mosaic-version" content="1.5.23">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
  <title>Mosaic — a board for Standard Notes</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/mosaic-7ba5a57b3f97.css">
  <script defer src="./assets/mosaic-ae40f28880fc.js"></script>
<meta name="im-shared-core" content="2f9b64fc8545947e787c71babafb2dabece1ce38db99b4ab1a8be2141928ea19">
<meta name="im-shared-ui" content="bffce36d164811270044669f64e5b1b22cd9612add97f7e5fde7b27883f9b677">
</head>
<body>
  <div id="app">
    <div id="notice" role="alert" hidden></div>
    <header class="board-toolbar ui-toolbar">
      <div id="selection-toolbar" class="ui-selection-toolbar" hidden></div>
      <button id="search-button" class="ui-toolbar-button" aria-label="Search and tags" aria-expanded="false" aria-controls="search-tags-panel"></button>
      <button id="more-button" class="ui-toolbar-button ui-toolbar-more" aria-label="More options" aria-haspopup="menu" aria-expanded="false"></button>
      <div id="filter-pill" class="board-filter-pill ui-filter-pill" role="group" aria-label="Card filter" hidden>
        <button id="change-filter" class="ui-filter-change" aria-label="Change filters" aria-expanded="false"></button>
        <button id="clear-filter" class="ui-filter-clear" aria-label="Clear all filters"></button>
      </div>
    </header>
    <section id="search-tags-panel" class="board-search-panel frost" aria-label="Search and tags" hidden>
      <div class="ui-search-row"><input id="search" type="search" placeholder="Search" aria-label="Search cards" autocomplete="off"><button id="date-filter-button" type="button" class="ui-search-filters" aria-label="Jump to date" title="Jump to date" aria-expanded="false" aria-controls="date-picker"></button></div>
      <div id="date-panel" hidden></div>
      <nav id="tag-filters" class="tag-filters" aria-label="Filter by emoji tag"></nav>
      <button id="pinned-filter" class="text-button" aria-label="Pinned cards" aria-pressed="false"><span id="pin-filter-icon"></span> Pinned cards</button>
    </section>
    <main id="viewport" tabindex="-1">
      <div class="board-content">
        <div id="board" role="list" aria-label="Cards"></div>
        <div id="empty" class="empty-state" hidden><p>No matches.</p><button id="empty-action" class="text-button">Clear filters</button></div>
        <div id="welcome" class="welcome" hidden><a href="./mosaic.ext.json">Install in Standard Notes</a><button id="preview-button" class="text-button">Preview</button></div>
      </div>
    </main>
    <section id="capture-composer" class="inline-composer" aria-label="New card">
      <div id="capture-reply" hidden></div>
      <div id="capture-field"></div>
      <span id="save-status" role="status" hidden></span>
    </section>
    <div id="selection-bar" class="ui-selection-status" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="menu" class="menu" role="menu" hidden></div>
    <dialog id="modal" aria-labelledby="dialog-title"><div id="modal-content"></div></dialog>
  </div>
</body>
</html>
